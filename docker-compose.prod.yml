version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: toralco_app
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - DATABASE_URL=postgresql://toralco:${POSTGRES_PASSWORD}@postgres:5432/toralco_erp?schema=public
      - NEXTAUTH_URL=https://toralcoerp.quantium.com.do
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - toralco_network

  postgres:
    image: postgres:16-alpine
    container_name: toralco_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: toralco
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: toralco_erp
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toralco -d toralco_erp"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - toralco_network

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: toralco_migrate
    environment:
      - DATABASE_URL=postgresql://toralco:${POSTGRES_PASSWORD}@postgres:5432/toralco_erp?schema=public
    command: npx prisma migrate deploy
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - toralco_network
    restart: "no"

volumes:
  pgdata:

networks:
  toralco_network:
    driver: bridge
