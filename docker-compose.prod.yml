services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      DATABASE_URL: postgresql://toralco:${POSTGRES_PASSWORD}@postgres:5432/toralco_erp?schema=public
      NEXTAUTH_URL: https://toralcoerp.quantium.com.do
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.toralco-app.rule=Host(`toralcoerp.quantium.com.do`)
      - traefik.http.routers.toralco-app.entrypoints=https
      - traefik.http.routers.toralco-app.tls=true
      - traefik.http.routers.toralco-app.tls.certresolver=letsencrypt
      - traefik.http.services.toralco-app.loadbalancer.server.port=3000
      - traefik.http.routers.toralco-app-http.rule=Host(`toralcoerp.quantium.com.do`)
      - traefik.http.routers.toralco-app-http.entrypoints=http
      - traefik.http.routers.toralco-app-http.middlewares=toralco-https-redirect
      - traefik.http.middlewares.toralco-https-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.toralco-https-redirect.redirectscheme.permanent=true

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: toralco
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: toralco_erp
    volumes:
      - toralco_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toralco -d toralco_erp"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  toralco_pgdata:
