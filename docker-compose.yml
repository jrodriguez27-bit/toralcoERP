version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: toralco_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: toralco
      POSTGRES_PASSWORD: toralco_dev_2024
      POSTGRES_DB: toralco_erp
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: toralco_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@toralco.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - '5050:80'
    depends_on:
      - postgres

volumes:
  pgdata:
